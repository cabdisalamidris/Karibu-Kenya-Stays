databases:
  - name: aurum-reserve-db
    plan: free
    databaseName: aurum_reserve
    user: aurum_reserve

services:
  - type: web
    name: aurum-reserve-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: AUTO_SEED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: aurum-reserve-db
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
